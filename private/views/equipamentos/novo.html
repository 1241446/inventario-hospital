<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Equipamento | MedControl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../../../assets/css/1241446.css">
    <style>
        :root { --primary-color: #4fc3f7; --bg-dark: #0a2540; --bg-light: #f5f5f5; --text-light: #7f8c8d; --border-color: #ecf0f1; --danger-color: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-light); }
        .container-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: linear-gradient(135deg, var(--bg-dark) 0%, #0d3d5c 100%); color: white; padding: 20px; position: fixed; height: 100vh; left: 0; top: 0; overflow-y: auto; }
        .sidebar-header { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(79, 195, 247, 0.3); }
        .sidebar-header a { font-size: 1.3em; font-weight: 700; color: white; text-decoration: none; }
        .sidebar-header a span { color: var(--primary-color); }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 10px; }
        .sidebar-menu a { display: block; padding: 12px 15px; color: #b0c4de; text-decoration: none; border-radius: 6px; transition: all 0.3s ease; border-left: 3px solid transparent; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background: rgba(79, 195, 247, 0.2); color: var(--primary-color); border-left-color: var(--primary-color); }
        .sidebar-menu a i { margin-right: 12px; width: 20px; }
        .sidebar-footer { position: absolute; bottom: 20px; left: 20px; right: 20px; }
        .logout-btn { width: 100%; padding: 12px; background: var(--danger-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .main-content { flex: 1; margin-left: 260px; padding: 20px; }
        .topbar { background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .topbar h1 { font-size: 1.3em; color: var(--bg-dark); margin: 0; }
        .content-box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .tab-buttons { display: flex; gap: 5px; border-bottom: 2px solid var(--border-color); margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; padding: 15px 20px; font-size: 1em; font-weight: 600; color: var(--text-light); cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn:hover, .tab-btn.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--bg-dark); font-weight: 600; font-size: 0.95em; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 6px; font-size: 1em; transition: all 0.3s ease; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary-color); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 10px; margin-top: 20px; }
        .btn-primary { background: var(--primary-color); color: var(--bg-dark); }
        .btn-primary:hover { background: #0097a7; color: white; }
        .btn-secondary { background: var(--border-color); color: var(--bg-dark); }
        .step-indicator { display: flex; gap: 10px; margin-bottom: 20px; justify-content: space-between; }
        .step { flex: 1; padding: 15px; background: var(--bg-light); border-radius: 6px; text-align: center; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .step.active { background: var(--primary-color); color: white; }
    </style>
</head>
<body>

<div class="container-layout">
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="../../index.html"><i class="fa-solid fa-hospital-user" style="color: var(--primary-color);"></i> Med<span>Control</span></a>
        </div>
        <ul class="sidebar-menu">
            <li><a href="../../index.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
            <li><a href="lista.html" class="active"><i class="fa-solid fa-stethoscope"></i> Equipamentos</a></li>
            <li><a href="../localizacoes/lista.html"><i class="fa-solid fa-map-location-dot"></i> Localizações</a></li>
            <li><a href="../fornecedores/lista.html"><i class="fa-solid fa-truck-medical"></i> Fornecedores</a></li>
            <li><a href="../documentos/lista.html"><i class="fa-solid fa-file-pdf"></i> Documentação</a></li>
            <li><a href="../garantias/lista.html"><i class="fa-solid fa-file-contract"></i> Garantias</a></li>
            <li><a href="../conteudos/gestao.html"><i class="fa-solid fa-newspaper"></i> Conteúdos</a></li>
        </ul>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket" style="margin-right: 8px;"></i> Sair</button>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar"><h1><i class="fa-solid fa-plus" style="margin-right: 10px;"></i>Novo Equipamento</h1></div>

        <div class="content-box">
            <div class="step-indicator">
                <div class="step active" onclick="goToStep(0)">1. Identificação</div>
                <div class="step" onclick="goToStep(1)">2. Dados Técnicos</div>
                <div class="step" onclick="goToStep(2)">3. Garantia</div>
                <div class="step" onclick="goToStep(3)">4. Fornecedores</div>
            </div>

            <form id="novoForm">
                <div class="tab-content active" id="step0">
                    <h3>Identificação do Equipamento</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Código Único *</label>
                            <input type="text" name="codigo" required placeholder="EQ-XXX">
                        </div>
                        <div class="form-group">
                            <label>Nome *</label>
                            <input type="text" name="nome" required placeholder="Nome do equipamento">
                        </div>
                        <div class="form-group">
                            <label>Marca *</label>
                            <input type="text" name="marca" required placeholder="Marca">
                        </div>
                        <div class="form-group">
                            <label>Modelo *</label>
                            <input type="text" name="modelo" required placeholder="Modelo">
                        </div>
                        <div class="form-group">
                            <label>Número de Série *</label>
                            <input type="text" name="serie" required placeholder="Número de série">
                        </div>
                        <div class="form-group">
                            <label>Localização *</label>
                            <select name="localizacao" required>
                                <option value="">--- Seleccione ---</option>
                                <option value="UCI-01">UCI-01</option>
                                <option value="UCI-02">UCI-02</option>
                                <option value="Urgência">Urgência</option>
                                <option value="Bloco Operatório">Bloco Operatório</option>
                                <option value="Cardio">Cardio</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Estado *</label>
                            <select name="estado" required>
                                <option value="">--- Seleccione ---</option>
                                <option value="Operacional">Operacional</option>
                                <option value="Manutenção">Manutenção</option>
                                <option value="Avariado">Avariado</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Criticidade *</label>
                            <select name="criticidade" required>
                                <option value="">--- Seleccione ---</option>
                                <option value="Crítica">Crítica</option>
                                <option value="Alta">Alta</option>
                                <option value="Média">Média</option>
                                <option value="Baixa">Baixa</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="step1">
                    <h3>Dados Técnicos</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Tensão Alimentação</label>
                            <input type="text" name="tensao" placeholder="Ex: 220V ~ 50Hz">
                        </div>
                        <div class="form-group">
                            <label>Potência</label>
                            <input type="text" name="potencia" placeholder="Ex: 500W">
                        </div>
                        <div class="form-group">
                            <label>Peso</label>
                            <input type="text" name="peso" placeholder="Ex: 28.5 kg">
                        </div>
                        <div class="form-group">
                            <label>Dimensões</label>
                            <input type="text" name="dimensoes" placeholder="Ex: 65cm x 45cm x 120cm">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Observações Técnicas</label>
                            <textarea name="observacoes" style="resize: vertical; min-height: 100px;" placeholder="Informações técnicas adicionais..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="step2">
                    <h3>Informações de Garantia</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Data de Início *</label>
                            <input type="date" name="dataInicio" required>
                        </div>
                        <div class="form-group">
                            <label>Data de Fim *</label>
                            <input type="date" name="dataFim" required>
                        </div>
                        <div class="form-group">
                            <label>Tipo de Garantia</label>
                            <select name="tipoGarantia">
                                <option value="">--- Seleccione ---</option>
                                <option value="Fabricante">Fabricante</option>
                                <option value="Estendida">Estendida</option>
                                <option value="Nenhuma">Nenhuma</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Documentação Garantia</label>
                            <input type="file" name="documentoGarantia">
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="step3">
                    <h3>Fornecedores Associados</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Fabricante</label>
                            <select name="fabricante">
                                <option value="">--- Seleccione ---</option>
                                <option value="Siemens">Siemens</option>
                                <option value="Philips">Philips</option>
                                <option value="Fresenius">Fresenius</option>
                                <option value="Zoll">Zoll</option>
                                <option value="GE Healthcare">GE Healthcare</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Distribuidor</label>
                            <input type="text" name="distribuidor" placeholder="Nome do distribuidor">
                        </div>
                        <div class="form-group">
                            <label>Assistência Técnica</label>
                            <input type="text" name="assistencia" placeholder="Nome da assistência técnica">
                        </div>
                    </div>
                </div>

                <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: space-between;">
                    <button type="button" class="btn btn-secondary" onclick="goToPreviousStep()"><i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Anterior</button>
                    <div>
                        <button type="button" class="btn btn-secondary" onclick="history.back()"><i class="fa-solid fa-times" style="margin-right: 8px;"></i> Cancelar</button>
                        <button type="button" class="btn btn-primary" onclick="goToNextStep()" id="btnProximo"><i class="fa-solid fa-arrow-right" style="margin-right: 8px;"></i> Próximo</button>
                        <button type="submit" class="btn btn-primary" id="btnSubmit" style="display: none;"><i class="fa-solid fa-check" style="margin-right: 8px;"></i> Guardar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../../../../assets/js/1241446.js"></script>
<script>
    let currentStep = 0;
    const totalSteps = 4;

    function logout() { if (confirm('Tem a certeza?')) window.location.href = '../../public/login.html'; }

    function goToStep(step) {
        if (validateCurrentStep()) {
            currentStep = step;
            updateSteps();
        }
    }

    function goToNextStep() {
        if (currentStep < totalSteps - 1 && validateCurrentStep()) {
            currentStep++;
            updateSteps();
        } else if (currentStep === totalSteps - 1) {
            document.getElementById('novoForm').submit();
        }
    }

    function goToPreviousStep() {
        if (currentStep > 0) {
            currentStep--;
            updateSteps();
        }
    }

    function validateCurrentStep() {
        const form = document.getElementById('novoForm');
        const fields = form.querySelectorAll(`#step${currentStep} input[required], #step${currentStep} select[required]`);
        let valid = true;
        fields.forEach(field => {
            if (!field.value.trim()) { field.style.borderColor = '#e74c3c'; valid = false; }
            else { field.style.borderColor = ''; }
        });
        return valid;
    }

    function updateSteps() {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(`step${currentStep}`).classList.add('active');
        document.querySelectorAll('.step')[currentStep].classList.add('active');

        document.getElementById('btnProximo').style.display = currentStep === totalSteps - 1 ? 'none' : 'inline-block';
        document.getElementById('btnSubmit').style.display = currentStep === totalSteps - 1 ? 'inline-block' : 'none';
    }

    document.getElementById('novoForm').addEventListener('submit', (e) => {
        e.preventDefault();
        showNotification('Equipamento registado com sucesso!', 'success');
        setTimeout(() => { window.location.href = 'lista.html'; }, 1500);
    });
</script>
</body>
</html>
