<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Fornecedor | MedControl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../../../assets/css/1241446.css">
    <style>
        :root { --primary-color: #4fc3f7; --bg-dark: #0a2540; --bg-light: #f5f5f5; --text-light: #7f8c8d; --border-color: #ecf0f1; --danger-color: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-light); }
        .container-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: linear-gradient(135deg, var(--bg-dark) 0%, #0d3d5c 100%); color: white; padding: 20px; position: fixed; height: 100vh; left: 0; top: 0; overflow-y: auto; }
        .sidebar-header { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(79, 195, 247, 0.3); }
        .sidebar-header a { font-size: 1.3em; font-weight: 700; color: white; text-decoration: none; }
        .sidebar-header a span { color: var(--primary-color); }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 10px; }
        .sidebar-menu a { display: block; padding: 12px 15px; color: #b0c4de; text-decoration: none; border-radius: 6px; border-left: 3px solid transparent; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background: rgba(79, 195, 247, 0.2); color: var(--primary-color); border-left-color: var(--primary-color); }
        .sidebar-menu a i { margin-right: 12px; width: 20px; }
        .sidebar-footer { position: absolute; bottom: 20px; left: 20px; right: 20px; }
        .logout-btn { width: 100%; padding: 12px; background: var(--danger-color); color: white; border: none; border-radius: 6px; cursor: pointer; }
        .main-content { flex: 1; margin-left: 260px; padding: 20px; }
        .topbar { background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .topbar h1 { font-size: 1.3em; color: var(--bg-dark); margin: 0; }
        .content-box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .tab-buttons { display: flex; gap: 5px; border-bottom: 2px solid var(--border-color); margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; padding: 15px 20px; font-size: 1em; font-weight: 600; color: var(--text-light); cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn:hover, .tab-btn.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--bg-dark); font-weight: 600; font-size: 0.95em; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 6px; font-size: 1em; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary-color); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 10px; margin-top: 20px; }
        .btn-primary { background: var(--primary-color); color: var(--bg-dark); }
        .btn-primary:hover { background: #0097a7; color: white; }
        .btn-secondary { background: var(--border-color); color: var(--bg-dark); }
    </style>
</head>
<body>

<div class="container-layout">
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="../../index.html"><i class="fa-solid fa-hospital-user" style="color: var(--primary-color);"></i> Med<span>Control</span></a>
        </div>
        <ul class="sidebar-menu">
            <li><a href="../../index.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
            <li><a href="../equipamentos/lista.html"><i class="fa-solid fa-stethoscope"></i> Equipamentos</a></li>
            <li><a href="../localizacoes/lista.html"><i class="fa-solid fa-map-location-dot"></i> Localizações</a></li>
            <li><a href="lista.html" class="active"><i class="fa-solid fa-truck-medical"></i> Fornecedores</a></li>
            <li><a href="../documentos/lista.html"><i class="fa-solid fa-file-pdf"></i> Documentação</a></li>
            <li><a href="../garantias/lista.html"><i class="fa-solid fa-file-contract"></i> Garantias</a></li>
            <li><a href="../conteudos/gestao.html"><i class="fa-solid fa-newspaper"></i> Conteúdos</a></li>
        </ul>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket" style="margin-right: 8px;"></i> Sair</button>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar"><h1><i class="fa-solid fa-plus" style="margin-right: 10px;"></i>Novo Fornecedor</h1></div>

        <div class="content-box">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab(this, 0)">Dados Empresa</button>
                <button class="tab-btn" onclick="switchTab(this, 1)">Contacto</button>
                <button class="tab-btn" onclick="switchTab(this, 2)">Equipamentos</button>
            </div>

            <form id="novoForm">
                <div class="tab-content active">
                    <h3>Informações da Empresa</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Código *</label>
                            <input type="text" name="codigo" required placeholder="FORN-XXX">
                        </div>
                        <div class="form-group">
                            <label>Nome *</label>
                            <input type="text" name="nome" required placeholder="Nome da empresa">
                        </div>
                        <div class="form-group">
                            <label>Tipo *</label>
                            <select name="tipo" required>
                                <option value="">--- Seleccione ---</option>
                                <option value="Fabricante">Fabricante</option>
                                <option value="Distribuidor">Distribuidor</option>
                                <option value="Assistência">Assistência</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>NIF/NIPC</label>
                            <input type="text" name="nif" placeholder="Número de identificação">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Morada</label>
                            <input type="text" name="morada" placeholder="Morada completa">
                        </div>
                        <div class="form-group">
                            <label>Código Postal</label>
                            <input type="text" name="codigoPostal" placeholder="Código postal">
                        </div>
                        <div class="form-group">
                            <label>Localidade</label>
                            <input type="text" name="localidade" placeholder="Cidade/Localidade">
                        </div>
                    </div>
                </div>

                <div class="tab-content">
                    <h3>Informações de Contacto</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" name="email" required placeholder="contacto@empresa.pt">
                        </div>
                        <div class="form-group">
                            <label>Telefone *</label>
                            <input type="tel" name="telefone" required placeholder="+351 xx xxxx xxxx">
                        </div>
                        <div class="form-group">
                            <label>Fax</label>
                            <input type="tel" name="fax" placeholder="+351 xx xxxx xxxx">
                        </div>
                        <div class="form-group">
                            <label>Website</label>
                            <input type="url" name="website" placeholder="www.empresa.pt">
                        </div>
                        <div class="form-group">
                            <label>Email Suporte</label>
                            <input type="email" name="emailSupporte" placeholder="suporte@empresa.pt">
                        </div>
                        <div class="form-group">
                            <label>Pessoa Contacto</label>
                            <input type="text" name="pessoaContacto" placeholder="Nome da pessoa de contacto">
                        </div>
                    </div>
                </div>

                <div class="tab-content">
                    <h3>Equipamentos Fornecidos</h3>
                    <div class="form-group">
                        <label>Equipamentos Associados</label>
                        <div style="border: 2px solid var(--border-color); border-radius: 6px; padding: 15px; max-height: 200px; overflow-y: auto;">
                            <label style="display: flex; gap: 10px; margin-bottom: 10px; cursor: pointer; font-weight: normal;">
                                <input type="checkbox" name="eq1"> EQ-001 - Ventilador Pulmonar
                            </label>
                            <label style="display: flex; gap: 10px; margin-bottom: 10px; cursor: pointer; font-weight: normal;">
                                <input type="checkbox" name="eq2"> EQ-002 - Monitor Cardíaco
                            </label>
                            <label style="display: flex; gap: 10px; margin-bottom: 10px; cursor: pointer; font-weight: normal;">
                                <input type="checkbox" name="eq3"> EQ-003 - Bomba de Infusão
                            </label>
                            <label style="display: flex; gap: 10px; margin-bottom: 10px; cursor: pointer; font-weight: normal;">
                                <input type="checkbox" name="eq4"> EQ-004 - Desfibrilhador
                            </label>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="history.back()"><i class="fa-solid fa-times" style="margin-right: 8px;"></i> Cancelar</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check" style="margin-right: 8px;"></i> Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../../../../assets/js/1241446.js"></script>
<script>
    function logout() { if (confirm('Tem a certeza?')) window.location.href = '../../public/login.html'; }

    function switchTab(btn, index) {
        const buttons = document.querySelectorAll('.tab-btn');
        const contents = document.querySelectorAll('.tab-content');
        buttons.forEach(b => b.classList.remove('active'));
        contents.forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        contents[index].classList.add('active');
    }

    document.getElementById('novoForm').addEventListener('submit', (e) => {
        e.preventDefault();
        showNotification('Fornecedor criado com sucesso!', 'success');
        setTimeout(() => { window.location.href = 'lista.html'; }, 1500);
    });
</script>
</body>
</html>
